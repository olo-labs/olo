plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'olo-backend'
include 'olo-temporal-sdk'
def toolGateClient = [file('olo-mono/olo-toolgate-client'), file('../olo-mono/olo-toolgate-client')]
        .find { it.isDirectory() }
if (toolGateClient == null) {
    throw new GradleException('Missing olo-toolgate-client: initialize the pinned olo-mono submodule')
}
includeBuild(toolGateClient)

// olo-definition and olo-workflow-input resolve from olo-mono/build/repo (publish-libs.bat).
