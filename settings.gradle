plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'olo-backend'
include 'olo-temporal-sdk'

def oloDefinitionDir = file('../olo-mono/olo-definition')
def oloWorkflowInputDir = file('../olo-mono/olo-workflow-input')

if (oloDefinitionDir.directory) {
    includeBuild(oloDefinitionDir) {
        dependencySubstitution {
            substitute module('org.olo:olo-definition') using project(':olo-definition')
        }
    }
}
if (oloWorkflowInputDir.directory) {
    includeBuild(oloWorkflowInputDir) {
        dependencySubstitution {
            substitute module('org.olo:olo-workflow-input') using project(':')
        }
    }
}
