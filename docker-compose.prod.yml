# Production: backend only. Settings from .env or host env; defaults from .env.example.
# Usage: copy .env.example to .env, edit, then: docker compose -f docker-compose.prod.yml up -d
# Or: export vars and run; Compose substitutes ${VAR} from .env or shell.

services:
  olo-backend:
    image: olo:latest
    # Or use your registry: image: ghcr.io/myorg/olo:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    env_file:
      - .env.example
    ports:
      - "7080:7080"
    environment:
      SERVER_PORT: "7080"
      OLO_CACHE_HOST: ${OLO_CACHE_HOST:-redis}
      OLO_CACHE_PORT: ${OLO_CACHE_PORT:-46379}
      OLO_CACHE_DATABASE: ${OLO_CACHE_DATABASE:-0}
      OLO_TEMPORAL_TARGET: ${OLO_TEMPORAL_TARGET:-temporal:7233}
      OLO_CONFIGURATION_DIR: ${OLO_CONFIGURATION_DIR:-/app/olo-configuration}
      OLO_CHAT_CALLBACK_BASE_URL: ${OLO_CHAT_CALLBACK_BASE_URL:-http://localhost:7080}
      OLO_SECURITY_ISSUER: ${OLO_SECURITY_ISSUER:?set OLO_SECURITY_ISSUER}
      OLO_SECURITY_AUDIENCE: ${OLO_SECURITY_AUDIENCE:?set OLO_SECURITY_AUDIENCE}
      OLO_SECURITY_JWK_SET_URI: ${OLO_SECURITY_JWK_SET_URI:-}
      OLO_CALLBACK_KEY_ID: ${OLO_CALLBACK_KEY_ID:?set OLO_CALLBACK_KEY_ID}
      OLO_CALLBACK_KEY: ${OLO_CALLBACK_KEY:?set OLO_CALLBACK_KEY}
      OLO_SWAGGER_UI_ENABLED: ${OLO_SWAGGER_UI_ENABLED:-false}
      # Temporal payload key ring (M5.2), the same file the workers mount.
      OLO_PAYLOAD_KEYS_FILE: /run/secrets/olo-payload-keys.json
    volumes:
      - ${OLO_PAYLOAD_KEYS_HOST_FILE:?set OLO_PAYLOAD_KEYS_HOST_FILE to the payload key ring}:/run/secrets/olo-payload-keys.json:ro
    restart: unless-stopped
    # Optional: add a healthcheck if your image has wget/curl (e.g. custom Dockerfile)
    # healthcheck:
    #   test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7080/api/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s
