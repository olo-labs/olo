# =============================================================================

# Default configuration. All properties can be overridden by environment variables.

# Spring Boot relaxed binding: server.port → SERVER_PORT, olo.chat.callback-base-url → OLO_CHAT_CALLBACK_BASE_URL.

# Use .env or .env.example (copy to .env) for local/docker overrides; see repo root .env.example.

# =============================================================================



spring.application.name=olo-backend

server.port=7080



# Olo backend release label (GET /api/ui/context). Override: OLO_VERSION

olo.version=v1.0.0-Dev



# Swagger UI. Override: OLO_SWAGGER_UI_ENABLED (true/false). Set false in production to hide docs.

olo.swagger-ui.enabled=true

springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.enabled=${olo.swagger-ui.enabled:true}



# Chat BE → worker callback (worker POSTs events here). Override: OLO_CHAT_CALLBACK_BASE_URL

olo.chat.callback-base-url=${OLO_CHAT_CALLBACK_BASE_URL:http://localhost:7080}



# Temporal server target. Task queue, workflow type, and tenant come from olo.configuration.dir workflow JSON.

# Override: OLO_TEMPORAL_TARGET

olo.temporal.target=localhost:47233



# Request logging (INFO shows all REQUEST lines from RequestLoggingFilter)

logging.level.org.olo.app.filter.RequestLoggingFilter=INFO



# Identity (M3.1-3.2). Every API call and the WebSocket handshake need a verified JWT; there is no demo mode.
# Required: OLO_SECURITY_ISSUER and OLO_SECURITY_AUDIENCE. The app refuses to start without them.
# OLO_SECURITY_JWK_SET_URI: the issuer's JWKS endpoint (blank = OIDC discovery from the issuer).
olo.security.issuer=${OLO_SECURITY_ISSUER:}
olo.security.audience=${OLO_SECURITY_AUDIENCE:}
olo.security.jwk-set-uri=${OLO_SECURITY_JWK_SET_URI:}
olo.security.algorithms=RS256,ES256
olo.security.clock-skew=30s
# Claim naming the IdP session (OIDC sid). Revoked sessions are refused.
olo.security.session-claim=sid
# Header a member of several tenants uses to choose one.
olo.security.tenant-header=X-OLO-Tenant
olo.security.roles-claim=roles
olo.security.admin-role=olo-admin
# redis (default, shared by all instances) or memory (single-process tests only).
olo.security.store=${OLO_SECURITY_STORE:redis}
olo.security.public-paths=/api/health,/api-docs,/api-docs/**,/swagger-ui.html,/swagger-ui/**
# First members of a fresh installation, for example:
# olo.security.bootstrap-memberships[0].issuer=https://idp.example.com/realms/olo
# olo.security.bootstrap-memberships[0].subject=<admin user's sub>
# olo.security.bootstrap-memberships[0].tenants=default



# Chat UI footer labels (GET /api/ui/context). Override: OLO_UI_TENANT_DISPLAY_NAME, OLO_UI_USER_DISPLAY_NAME

olo.ui.tenant-display-name=Default

olo.ui.user-display-name=Public



# Active pipeline definitions (place workflow JSON here manually). Override: OLO_CONFIGURATION_DIR
olo.configuration.dir=${OLO_CONFIGURATION_DIR:../olo-mono/olo-definition/olo-configuration/current-active}



# Cache (Redis) for session persistence. Override: OLO_CACHE_HOST, OLO_CACHE_PORT, OLO_CACHE_DATABASE

olo.cache.host=localhost

olo.cache.port=46379

olo.cache.database=0

spring.data.redis.host=${olo.cache.host:localhost}

spring.data.redis.port=${olo.cache.port:46379}

spring.data.redis.database=${olo.cache.database:0}

# Only if you want to run without Redis: uncomment the next line.

# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration



# Documents / resource upload (POST /api/resource/upload). Override: OLO_RESOURCE_UPLOAD_BASE_DIR

olo.resource.upload.base-dir=${java.io.tmpdir}/olo-resource-uploads

# RAG ingest (POST /api/rag/ingest). Override: OLO_RAG_INGEST_PIPELINE, OLO_RAG_INGEST_QUEUE
olo.rag.ingest.pipeline=documents-index
olo.rag.ingest.queue=oloQueue2

# Chat RAG query pipeline when capabilitySource is selected in olo-chat
olo.chat.rag.pipeline=rag-chat

spring.servlet.multipart.max-file-size=100MB

spring.servlet.multipart.max-request-size=110MB

spring.servlet.multipart.resolve-lazily=false

logging.level.org.olo.app.service.ResourceUploadService=INFO

logging.level.org.olo.app.controller.ResourceUploadController=INFO

logging.level.org.olo.app.controller.ResourceUploadExceptionHandler=INFO



# Worker run-event callbacks (POST /api/runs/{runId}/events) are HMAC-signed by the worker (M3.11).
# Set the same OLO_CALLBACK_KEY_ID / OLO_CALLBACK_KEY (at least 32 bytes) on the worker. Without a key, every callback is
# refused. During rotation, keep the old key as the "previous" entry until all workers use the new one.
olo.worker-callback.keys[0].id=${OLO_CALLBACK_KEY_ID:}
olo.worker-callback.keys[0].secret=${OLO_CALLBACK_KEY:}
olo.worker-callback.keys[1].id=${OLO_CALLBACK_PREVIOUS_KEY_ID:}
olo.worker-callback.keys[1].secret=${OLO_CALLBACK_PREVIOUS_KEY:}
olo.worker-callback.max-skew=5m

# ToolGate user credentials (M3.4). Workers call POST /api/internal/toolgate/credentials (worker-signed) with the run's
# identity binding reference; the backend rechecks session and membership, signs a session assertion and exchanges it
# at ToolGate Control. Session revocations are passed on to ToolGate. Off unless OLO_TOOLGATE_CREDENTIALS=true.
olo.toolgate.credentials.enabled=${OLO_TOOLGATE_CREDENTIALS:false}
olo.toolgate.credentials.control-url=${OLO_TOOLGATE_CONTROL_URL:}
olo.toolgate.credentials.service-token-path=${OLO_TOOLGATE_SERVICE_TOKEN_PATH:}
olo.toolgate.credentials.assertion-issuer=${OLO_TOOLGATE_ASSERTION_ISSUER:}
olo.toolgate.credentials.assertion-audience=${OLO_TOOLGATE_ASSERTION_AUDIENCE:toolgate-token-exchange}
olo.toolgate.credentials.key-id=${OLO_TOOLGATE_ASSERTION_KEY_ID:}
olo.toolgate.credentials.private-key-path=${OLO_TOOLGATE_ASSERTION_KEY_PATH:}
olo.toolgate.credentials.assertion-lifetime=15s

# Temporal payload protection (M5.2): every workflow input and result is sealed with AES-256-GCM under the run's tenant
# key. Mount the same key ring as the workers. Without one the backend refuses to start, unless
# OLO_PAYLOAD_PROTECTION=disabled-for-development is set for a local development stack.
olo.temporal.payload-keys-file=${OLO_PAYLOAD_KEYS_FILE:}
olo.temporal.payload-protection=${OLO_PAYLOAD_PROTECTION:}
olo.temporal.codec-server.enabled=${OLO_CODEC_SERVER_ENABLED:false}
