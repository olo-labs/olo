// Docker CI: resolve published olo-spi / olo-annotation from olo-mono/build/repo.
allprojects { p ->
    repositories {
        def repo = [
            p.rootProject.file('olo-mono/build/repo'),
            p.file('../../olo-mono/build/repo'),
            p.file('../olo-mono/build/repo'),
            p.layout.projectDirectory.dir('../build/repo').asFile,
        ].find { it.directory }
        if (repo != null) {
            maven {
                name = 'oloMono'
                url = repo
            }
        }
        mavenCentral()
        mavenLocal()
    }
}
