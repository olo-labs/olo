// Docker CI: ensure olo-spi / olo-annotation resolve libs from olo-mono/build/repo.
// Each module lives under olo-mono/<module>/ so ../build/repo is the shared local Maven cache.
allprojects {
    repositories {
        maven {
            name = 'oloMono'
            url = layout.projectDirectory.dir('../build/repo')
        }
        mavenCentral()
        mavenLocal()
    }
}
