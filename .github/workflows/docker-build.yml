# Build and push olo backend to Docker Hub (+ GHCR)
# Repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Pull: docker pull <DOCKERHUB_USERNAME>/olo:<library-version>  e.g. docker pull ololab/olo:0.0.1-SNAPSHOT
# Also publishes :latest on every push (e.g. docker pull ololab/olo:latest)
name: Publish Docker image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: olo

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Verify Docker Hub secrets
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to publish to Docker Hub."
            exit 1
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve library version
        id: version
        run: |
          LIB_VERSION=$(sed -n "s/^version = ['\"]\\(.*\\)['\"]/\\1/p" build.gradle | head -1)
          if [ -z "$LIB_VERSION" ]; then
            echo "::error::Could not read version from build.gradle"
            exit 1
          fi
          echo "id=$LIB_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing with library version: $LIB_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (Docker Hub)
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.id }}
            type=raw,value=latest

      - name: Docker metadata (GHCR)
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.id }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta-dockerhub.outputs.tags }}
            ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
